# Web only; set app name explicitly and configure public backend URL/key.
primary_region = "iad"
[build]
  dockerfile = "web/Dockerfile"
[env]
  PORT = "8080"
  API_UPSTREAM = "127.0.0.1:9"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
