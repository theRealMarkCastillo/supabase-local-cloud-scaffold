# Node app only. Set app name and runtime configuration for your own dev backend.
primary_region = "iad"
[build]
  dockerfile = "web-tanstack/Dockerfile"
[env]
  PORT = "3000"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
