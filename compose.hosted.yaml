name: supabase-hosted-client
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      PORT: '8080'
      # No local backend in this mode. Proxy routes are unused.
      API_UPSTREAM: '127.0.0.1:9'
      SUPABASE_BROWSER_URL: ${SUPABASE_BROWSER_URL:?Set the development backend URL}
      SUPABASE_BROWSER_KEY: ${SUPABASE_BROWSER_KEY:?Set its public client key}
    ports:
      - '127.0.0.1:${WEB_PORT:-8091}:8080'
