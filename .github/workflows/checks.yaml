name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test frontend-test
      - run: python3 -m py_compile scripts/stack.py scripts/functions.py scripts/migrations.py scripts/smoke.py scripts/setup_tools.py scripts/sql_safety.py
