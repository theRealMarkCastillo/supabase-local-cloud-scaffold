name: ${STACK_NAME:-supabase-starter}
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      PORT: '8080'
      API_UPSTREAM: api-gw:8000
      SUPABASE_BROWSER_URL: ${PUBLIC_URL}/supabase
      SUPABASE_BROWSER_KEY: ${ANON_KEY}
    ports:
      - '127.0.0.1:${WEB_PORT:-8094}:8080'
    depends_on:
      api-gw:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped
  mail:
    image: axllent/mailpit:v1.32.0
    ports:
      - '127.0.0.1:${MAIL_PORT:-18029}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
    volumes: ['mail-data:/data']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  auth:
    environment:
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_USER: ''
      GOTRUE_SMTP_PASS: ''
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '100'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'

volumes:
  mail-data:
